version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: fintech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fintech_chatbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: MyPassword123
    ports:
      - "5432:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: fintech-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fintech_chatbot
      DB_USER: postgres
      DB_PASSWORD: MyPassword123
      APP_TITLE: Fintech Chatbot API
      APP_VERSION: 1.0.0
      PAYPAL_MODE: sandbox
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: fintech-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
